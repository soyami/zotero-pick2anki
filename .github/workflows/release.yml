# ============ 发布工作流 ============
# 触发：推送纯数字标签（例如 1.0.7），或在 Actions 页手动运行。
#
# 做三件事：
#   1) 构建插件：npm run build → .scaffold/build/zotero-pick2anki.xpi 与 update.json
#   2) 把 .xpi 作为附件挂到该标签的 Release（用户从 Release 页下载安装）
#   3) 把 update.json 挂到固定的 release 标签
#      —— 插件 manifest 里的 update_url 指向 .../releases/download/release/update.json，
#         Zotero 靠它判断有没有新版本（也可用它放宽 strict_max_version，不必重发 .xpi）
#
# 标签命名：纯数字，不带 v（如 1.0.7）。必须与 package.json 的 version 一致，
#           因为 update.json 里的下载地址是 .../releases/download/<version>/zotero-pick2anki.xpi
#           （模板见 zotero-plugin.config.ts 的 xpiDownloadLink）。
name: Release

on:
  push:
    tags:
      # 纯数字版本号，如 1.0.7 / 2.1.0；不匹配 v1.0.7 这类带前缀的标签
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node（zotero-plugin-scaffold 需要 ≥ 22.8）
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建插件（类型检查 + 打包 .xpi）
        run: npm run build

      - name: 把 .xpi 挂到本次标签的 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="manual-$(date -u +%Y%m%d-%H%M%S)"
          else
            tag="$GITHUB_REF_NAME"
          fi
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "zotero-pick2anki 构建产物"
          gh release upload "$tag" .scaffold/build/zotero-pick2anki.xpi --clobber
          echo "已上传 .xpi → Release $tag"

      - name: 更新 release 标签下的 update.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view release >/dev/null 2>&1 || gh release create release --title "Update manifest" --notes "Zotero 通过插件 manifest 的 update_url 读取此处的 update.json"
          gh release upload release .scaffold/build/update.json --clobber
          echo "已更新 update.json"
